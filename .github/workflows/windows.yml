name: Windows

on:
  # Elle tetikleme: Actions -> Windows -> Run workflow (istenen dal secilir).
  # MavUI'de otomatik tetik yok; Windows kosusu uzun, sürüm/deneme aninda calistirilir.
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
      - 'Stable*'
    # Tag push'unda bu workflow AYRI bir kosu olarak calismaz: v* tag'i
    # release.yml'i tetikliyor, o da bu dosyayi workflow_call ile cagiriyor.
    # Ikisi de tetiklenirse ayni is iki kez derleniyordu (21 Agu: tek tag
    # 11 kosu acti).
    paths-ignore:
      - 'docs/**' # Do not trigger for any changes under docs
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'deploy/windows/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        BuildType: [Release]
        Arch: [x64] # Arm64

    defaults:
      run:
        shell: cmd

    env:
      # custom/cmake/CustomOverrides.cmake QGC_APP_NAME'i MavUI yapiyor, project()
      # adi oradan geliyor: kurulum dosyasi <proje>-installer.exe olarak dusuyor.
      ARTIFACT: MavUI-installer.exe
      PACKAGE: MavUI-installer
      QT_VERSION: 6.8.3
      GST_VERSION: 1.22.12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Install Vulkan
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          .\vulkan-sdk.exe --root C:\VulkanSDK\latest --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.glm com.lunarg.vulkan.volk com.lunarg.vulkan.vma com.lunarg.vulkan.debug
          echo "VULKAN_SDK=C:\VulkanSDK\latest" >> $env:GITHUB_ENV

      - name: Install GStreamer
        uses: blinemedical/setup-gstreamer@v1
        with:
          version: ${{ env.GST_VERSION }}

      # community.chocolatey.org zaman zaman 503/504 donuyor VE bu yolda choco
      # exit 0 ile cikiyor ("Chocolatey installed 0/0 packages"): adim yesil
      # gorunuyor, hata 55 dakika sonra `cmake --install` icinde
      # "Could not find QGC_NSIS_INSTALLER_CMD ... makensis" diye patliyordu
      # (21 Agu, kosu 32465660925). Uc kez dene, olmazsa kurulumu dogrudan indir,
      # sonunda makensis'i DOGRULA ve dizini PATH'e ekle -- choco is sirasinda
      # makine PATH'ini degistirse bile sonraki adimlar onu gormez.
      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          for ($i = 1; $i -le 3; $i++) {
            choco install nsis -y --no-progress
            if (Test-Path "$nsisDir\makensis.exe") { break }
            Write-Host "NSIS kurulamadi (deneme $i), tekrar denenecek..."
            Start-Sleep -Seconds 20
          }
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            Write-Host "Chocolatey olmadi, kurulum dogrudan indiriliyor."
            $url = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10-setup.exe/download"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\nsis-setup.exe" -UserAgent "Mozilla/5.0"
            Start-Process -FilePath "$env:RUNNER_TEMP\nsis-setup.exe" -ArgumentList "/S" -Wait
          }
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis kurulamadi: $nsisDir"
          }
          & "$nsisDir\makensis.exe" /VERSION
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: windows
          target: win64_msvc2022_64
          build-type: ${{ matrix.BuildType }}
          cpm-modules: ${{ runner.temp }}\shadow_build_dir\cpm_modules

      - name: Install Qt for Windows (x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          cache: true

      # Note: Must Use QtMultimedia VideoReceiver or build GStreamer manually
      - name: Install Qt for Windows (Arm64)
        if: matrix.Arch == 'Arm64'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ==3.1.19
          host: windows
          target: desktop
          arch: win64_msvc2022_arm64_cross_compiled
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.Arch == 'Arm64' && 'amd64_arm64' || 'x64' }}

      - name: Configure
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
              -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../msvc2022_64"
              -DQT_DEBUG_FIND_PACKAGE=ON
              -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: cmake --build . --target all --config ${{ matrix.BuildType }}

      - name: Sanity check release excecutable
        if: matrix.BuildType == 'Release'
        working-directory: ${{ runner.temp }}\shadow_build_dir\Release
        run: MavUI.exe --simple-boot-test

      - name: Install
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: cmake --install . --config ${{ matrix.BuildType }}

      - name: Upload Build File
        if: matrix.BuildType == 'Release'
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ env.ARTIFACT }}
          package_name: ${{ env.PACKAGE }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
