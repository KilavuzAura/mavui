name: Release

# Builds three platforms in one run and uploads their artifacts to a single
# GitHub Release.
#
#   pushing a tag like v1.2.3        -> a draft Release is created and files added
#   Actions -> Release -> Run workflow -> builds only; if the "tag" field is filled
#                                         in, it opens a Release for that tag
#
# The files land in a draft Release: before publishing you have to review the
# contents and press "Publish release".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release olusturulacak tag (bos birakilirsa yalniz derleme yapilir)'
        required: false
        type: string
        default: ''

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  linux:
    uses: ./.github/workflows/linux.yml
    with:
      release_only: true
    secrets: inherit

  android:
    uses: ./.github/workflows/android-linux.yml
    secrets: inherit

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Cagrilan workflow'larin artifact'leri ayni kosuya ait, buradan indirilir.
      - name: Ciktilari topla
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: What was collected
        run: ls -lR artifacts

      - name: Upload to the Release
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MavUI ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
