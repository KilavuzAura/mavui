name: Android-Linux

on:
  # For manual triggering and so release.yml can call it.
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
      - 'Stable*'
    # This workflow does not run as a SEPARATE run on a tag push: a v* tag
    # triggers release.yml, which calls this file via workflow_call. When both
    # fired, the same job was built twice (21 Aug: a single tag opened 11 runs).
    paths-ignore:
      - 'docs/**' # Do not trigger for any changes under docs
  pull_request:
    paths:
      - '.github/workflows/android-linux.yml'
      - 'deploy/android/**'
      - 'src/**'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'translations/*'

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The known-good duration is ~37 min (Build step, two ABIs). CPM/FetchContent
    # downloads have no timeout: if codeload stalls, the job hangs until the 6-hour
    # default limit (21 Aug: still in Build after 47 min). Cut it off at 75 min so
    # the failure shows up immediately.
    timeout-minutes: 75

    strategy:
      matrix:
        BuildType: [Release]

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT: MavUI.apk
      PACKAGE: MavUI-android
      QT_VERSION: 6.8.3
      # MavUI is signed with its own key: for an update to install over the version
      # already on the tablet, the signature must match the keystore that the local
      # build.sh uses. The keystore is not committed; it is written from the
      # ANDROID_KEYSTORE_BASE64 secret. Without the secret the APK comes out unsigned
      # (it will not install on a device and is only of archival value).
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mavui.keystore
      QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS || 'mavui' }}
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # The secrets context is NOT READABLE inside if: (only in env/with/run).
      # Writing "if: secrets.X != ''" directly makes the file unparseable: the job
      # never starts and the run failed in 0 s with "workflow file issue". We copy
      # the secret into env and build the conditions off env instead.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # 64-bit only. armeabi-v7a (32-bit) was dropped: the second ABI takes the
      # Build step from ~20 min to ~37 min, makes the APK 273 MB, and while its
      # sub-build runs NOT ONE LINE reaches the log -- that was the 19 minutes of
      # silence mistaken for a hang at "arm64-v8a.so linking" (21 Aug, run
      # 32466748336: the line landed at 09:36:44, the job finished at 09:55:50).
      # What is lost: pre-2015 32-bit devices; the target tablets are arm64.
      QT_ANDROID_ABIS: arm64-v8a

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Prepare signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$QT_ANDROID_KEYSTORE_PATH"

      - name: Install Qt for Android
        uses: ./.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: ${{ env.QT_VERSION }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
              -DCMAKE_WARN_DEPRECATED=FALSE
              -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}"
              -DQT_ANDROID_BUILD_ALL_ABIS=OFF
              -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../gcc_64"
              -DQT_ANDROID_SIGN_APK=${{ (env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '') && 'ON' || 'OFF' }}
              -DQT_DEBUG_FIND_PACKAGE=ON
              -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --build . --target all --config ${{ matrix.BuildType }}

      # Dizinde birden fazla apk olabilir (imzali/imzasiz); dosya adi proje adindan gelir.
      - run: cp ${{ runner.temp }}/shadow_build_dir/android-build/MavUI.apk ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}

      - name: Upload Build File
        if: matrix.BuildType == 'Release'
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ env.ARTIFACT }}
          package_name: ${{ env.PACKAGE }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Deploy to Play Store
      #   if: matrix.BuildType == 'Release'
      #   uses: ./.github/actions/playstore
      #   with:
      #     artifact_name: ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}
      #     service_account_json: ${{ secrets.SERVICE_ACCOUNT }}
