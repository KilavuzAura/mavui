app-id: tr.com.aurateam.mavui
runtime: org.gnome.Platform
runtime-version: 47
sdk: org.gnome.Sdk
command: MavUI
rename-appdata-file: tr.com.aurateam.mavui.metainfo.xml

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all # allow access USB Serial
  - --share=ipc
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-run/gvfs # GVfs
  - --filesystem=/media # automount via udisks
  - --filesystem=/run/udev:ro # enables firmware upload & auto connecting

modules:
  - name: MavUI
    sources:
      - type: git
        url: https://github.com/KilavuzAura/mavui.git
        tag: master
        commit: 35f7efd36e0d14e39378cc3acdbcb003b8c57921
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -D BUILD_SHARED_LIBS=OFF
      - -D BUILD_TESTING=OFF
    cleanup:
      - /include
      - /bin/dbf*
      - /bin/shp*
      - /lib/cmake
      - /share/shapelib
      - '*.a'
      - '*.cmake'
